<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Microsoft 365 tenant-to-tenant migration architecture</title>
<desc id="desc">Sanitized flow from source tenant through migration platform and identity and domain coordination to target tenant, followed by validation and hypercare.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker></defs>
<rect width="1200" height="470" rx="24" fill="transparent"/>
<g font-family="Inter,Arial,sans-serif">
  <text x="600" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="currentColor">Sanitized M365 Tenant-to-Tenant Migration Flow</text>
  <text x="600" y="68" text-anchor="middle" font-size="13" fill="#6b7280">High-level architecture — customer identifiers intentionally omitted</text>
  <g stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M230 190 H330"/><path d="M530 190 H650"/><path d="M850 190 H950"/><path d="M1030 250 V330 H760"/>
  </g>
  <g fill="none" stroke="#9ca3af" stroke-width="2">
    <rect x="55" y="125" width="175" height="130" rx="16"/><rect x="330" y="125" width="200" height="130" rx="16"/><rect x="650" y="125" width="200" height="130" rx="16"/><rect x="950" y="125" width="175" height="130" rx="16"/>
    <rect x="490" y="330" width="270" height="85" rx="16"/>
  </g>
  <g fill="currentColor">
    <text x="142" y="160" text-anchor="middle" font-size="16" font-weight="700">Source Tenant</text>
    <text x="142" y="187" text-anchor="middle" font-size="12">Exchange Online</text><text x="142" y="207" text-anchor="middle" font-size="12">OneDrive</text><text x="142" y="227" text-anchor="middle" font-size="12">Teams / SharePoint</text>
    <text x="430" y="160" text-anchor="middle" font-size="16" font-weight="700">Migration Platform</text>
    <text x="430" y="190" text-anchor="middle" font-size="12">AvePoint Fly</text><text x="430" y="211" text-anchor="middle" font-size="12">ShareGate</text><text x="430" y="232" text-anchor="middle" font-size="12">MigrationWiz</text>
    <text x="750" y="160" text-anchor="middle" font-size="16" font-weight="700">Target Tenant</text>
    <text x="750" y="190" text-anchor="middle" font-size="12">Identity &amp; Workload Setup</text><text x="750" y="211" text-anchor="middle" font-size="12">M365 Services</text><text x="750" y="232" text-anchor="middle" font-size="12">Access &amp; Data</text>
    <text x="1037" y="160" text-anchor="middle" font-size="16" font-weight="700">Cutover</text>
    <text x="1037" y="190" text-anchor="middle" font-size="12">User transition</text><text x="1037" y="211" text-anchor="middle" font-size="12">Validation</text><text x="1037" y="232" text-anchor="middle" font-size="12">Issue triage</text>
    <text x="625" y="363" text-anchor="middle" font-size="16" font-weight="700">Post-Migration Validation &amp; Hypercare</text>
    <text x="625" y="389" text-anchor="middle" font-size="12">Data checks · Access checks · Workload testing · Troubleshooting · Stabilization</text>
  </g>
  <g fill="#6b7280" font-size="12">
    <text x="280" y="175" text-anchor="middle">Migration scope</text><text x="590" y="175" text-anchor="middle">Data movement</text><text x="900" y="175" text-anchor="middle">Cutover</text>
  </g>
</g>
</svg>
