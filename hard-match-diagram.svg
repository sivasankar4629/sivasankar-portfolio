<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
<title id="title">Microsoft Entra ID Hard Match identity flow</title><desc id="desc">On-premises Active Directory user flows through Entra Connect and source anchor matching to an existing Entra ID user.</desc>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0"/><stop offset="1"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#62d8ff"/></marker></defs>
<rect width="1100" height="430" rx="18" fill="#0d1017"/>
<text x="55" y="55" fill="#62d8ff" font-family="Inter,Arial" font-size="14" font-weight="700" letter-spacing="2">IDENTITY SYNCHRONIZATION FLOW</text>
<g font-family="Inter,Arial">
<rect x="55" y="125" width="210" height="150" rx="14" fill="#11151e" stroke="#202634"/><text x="160" y="168" text-anchor="middle" fill="#f3f5f7" font-size="21" font-weight="700">Active Directory</text><text x="160" y="202" text-anchor="middle" fill="#98a1b2" font-size="14">On-premises user</text><text x="160" y="229" text-anchor="middle" fill="#98a1b2" font-size="14">UPN + identity data</text><text x="160" y="254" text-anchor="middle" fill="#62d8ff" font-size="12">Source object</text>
<rect x="330" y="125" width="210" height="150" rx="14" fill="#11151e" stroke="#202634"/><text x="435" y="168" text-anchor="middle" fill="#f3f5f7" font-size="21" font-weight="700">Entra Connect</text><text x="435" y="202" text-anchor="middle" fill="#98a1b2" font-size="14">Synchronization engine</text><text x="435" y="229" text-anchor="middle" fill="#98a1b2" font-size="14">Object matching</text><text x="435" y="254" text-anchor="middle" fill="#62d8ff" font-size="12">Hard Match decision</text>
<rect x="605" y="125" width="210" height="150" rx="14" fill="#11151e" stroke="#202634"/><text x="710" y="168" text-anchor="middle" fill="#f3f5f7" font-size="21" font-weight="700">Source Anchor</text><text x="710" y="202" text-anchor="middle" fill="#98a1b2" font-size="14">Immutable ID</text><text x="710" y="229" text-anchor="middle" fill="#98a1b2" font-size="14">Identity correlation</text><text x="710" y="254" text-anchor="middle" fill="#62d8ff" font-size="12">Matching attribute</text>
<rect x="880" y="125" width="165" height="150" rx="14" fill="#11151e" stroke="#62d8ff"/><text x="962" y="168" text-anchor="middle" fill="#f3f5f7" font-size="19" font-weight="700">Entra ID</text><text x="962" y="202" text-anchor="middle" fill="#98a1b2" font-size="14">Existing cloud</text><text x="962" y="229" text-anchor="middle" fill="#98a1b2" font-size="14">identity</text><text x="962" y="255" text-anchor="middle" fill="#62d8ff" font-size="12" font-weight="700">✓ Matched</text>
<line x1="265" y1="200" x2="330" y2="200" stroke="#62d8ff" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="540" y1="200" x2="605" y2="200" stroke="#62d8ff" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="815" y1="200" x2="880" y2="200" stroke="#62d8ff" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="185" y="330" width="730" height="50" rx="10" fill="#11151e" stroke="#202634"/><text x="550" y="361" text-anchor="middle" fill="#98a1b2" font-size="13">Validate objects → confirm attributes → perform controlled match → synchronize → verify result</text>
</g></svg>
